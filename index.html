<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentőhelikopter – Baleset-info.hu</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; }
    .header-felszallas { background: #c0392b; }
    .header-leszallas  { background: #2980b9; }
    .header { padding: 20px; text-align: center; }
    .header .emoji { font-size: 42px; margin-bottom: 6px; }
    .header h1 { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
    .header small { font-size: 13px; opacity: .75; }
    .body { padding: 14px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .card { background: #16213e; border-radius: 10px; padding: 12px; }
    .card .lbl { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
    .card .val { font-size: 20px; font-weight: bold; }
    .card .val.sm { font-size: 15px; }
    #map { width: 100%; height: 260px; border-radius: 10px; margin-bottom: 14px; }
    .no-coord { background: #16213e; border-radius: 10px; padding: 20px; text-align: center; color: #666; font-size: 13px; margin-bottom: 14px; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .btn { display: block; padding: 13px; border-radius: 10px; text-decoration: none; text-align: center; font-weight: bold; font-size: 14px; color: #fff; }
    .btn-fr24   { background: #ff6600; }
    .btn-gmaps  { background: #4285f4; }
    .status { background: #16213e; border-radius: 10px; padding: 12px; text-align: center; font-size: 12px; color: #666; margin-bottom: 14px; }
    .status span { color: #4caf50; }
    footer { text-align: center; padding: 14px; font-size: 11px; color: #444; }
  </style>
</head>
<body>

<div class="header" id="header">
  <div class="emoji" id="emoji">🚁</div>
  <h1 id="title">Mentőhelikopter</h1>
  <small id="subtitle">Betöltés...</small>
</div>

<div class="body">
  <div class="grid2">
    <div class="card">
      <div class="lbl">Hívójel</div>
      <div class="val" id="cs">—</div>
    </div>
    <div class="card">
      <div class="lbl">Lajstromjel</div>
      <div class="val" id="reg">—</div>
    </div>
    <div class="card">
      <div class="lbl">Magasság</div>
      <div class="val sm" id="alt">—</div>
    </div>
    <div class="card">
      <div class="lbl">Sebesség</div>
      <div class="val sm" id="vel">—</div>
    </div>
  </div>

  <div id="map-container"></div>

  <div class="btns">
    <a class="btn btn-fr24" id="btn-fr24" href="#" target="_blank">✈️ Flightradar24</a>
    <a class="btn btn-gmaps" id="btn-gmaps" href="#" target="_blank">📍 Google Maps</a>
  </div>

  <div class="status" id="status">Pozíció betöltése...</div>
</div>

<footer>Automatikus értesítő – Baleset-info.hu | adsb.fi adatai alapján</footer>

<script>
  function p(name) {
    return new URLSearchParams(window.location.search).get(name) || "";
  }

  const tipus = p("tipus");
  const cs    = p("cs");
  const reg   = p("reg");
  const icao  = p("icao").toLowerCase();
  const lat0  = parseFloat(p("lat")) || null;
  const lon0  = parseFloat(p("lon")) || null;
  const alt0  = p("alt");
  const vel0  = p("vel");
  const ido   = p("ido").replace(/\+/g, " ");

  // fejléc
  const isFel = tipus === "FELSZALLAS";
  document.getElementById("header").className = "header " + (isFel ? "header-felszallas" : "header-leszallas");
  document.getElementById("emoji").textContent  = isFel ? "🚁⬆️" : "🚁⬇️";
  document.getElementById("title").textContent  = "Mentőhelikopter " + (isFel ? "FELSZÁLLÁS" : "LESZÁLLÁS");
  document.getElementById("subtitle").textContent = ido + " | Magyar Légimentő";
  document.title = cs + " " + (isFel ? "felszáll" : "leszáll") + " – Baleset-info.hu";

  document.getElementById("cs").textContent  = cs  || "—";
  document.getElementById("reg").textContent = reg || "—";
  document.getElementById("alt").textContent = alt0 ? alt0 + " m" : "—";
  document.getElementById("vel").textContent = vel0 ? vel0 + " km/h" : "—";

  document.getElementById("btn-fr24").href = "https://www.flightradar24.com/" + cs;

  // térkép és élő frissítés
  let map = null;
  let marker = null;
  let initLat = lat0;
  let initLon = lon0;

  function initMap(lat, lon) {
    const container = document.getElementById("map-container");
    container.innerHTML = '<div id="map"></div>';
    map = L.map("map").setView([lat, lon], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    const icon = L.divIcon({
      html: '<div style="font-size:28px;transform:translate(-14px,-14px)">🚁</div>',
      className: ""
    });
    marker = L.marker([lat, lon], { icon: icon }).addTo(map);
    marker.bindPopup("<b>" + cs + "</b><br>" + reg).openPopup();

    document.getElementById("btn-gmaps").href =
      "https://www.google.com/maps/search/?api=1&query=" + lat + "," + lon;
  }

  function frissitTerkep(lat, lon) {
    if (!map) {
      initMap(lat, lon);
    } else {
      marker.setLatLng([lat, lon]);
      map.panTo([lat, lon]);
      document.getElementById("btn-gmaps").href =
        "https://www.google.com/maps/search/?api=1&query=" + lat + "," + lon;
    }
  }

  function lekerdezEloPozicio() {
    if (!icao) return;
    const urls = [
      "https://api.airplanes.live/v2/icao/" + icao,
      "https://opendata.adsb.fi/api/v2/icao/" + icao,
      "https://api.adsb.lol/v2/icao/" + icao,
    ];
    let tried = 0;
    function tryNext() {
      if (tried >= urls.length) {
        document.getElementById("status").innerHTML =
          "Élő pozíció nem elérhető – a gép lehet, hogy már földön van";
        return;
      }
      fetch(urls[tried++])
        .then(r => r.json())
        .then(data => {
          const ac = (data.ac || [])[0];
          if (ac && ac.lat != null && ac.lon != null) {
            const lat = ac.lat;
            const lon = ac.lon;
            const alt = ac.alt_baro && ac.alt_baro !== "ground"
              ? Math.round(ac.alt_baro * 0.3048) + " m" : "földön";
            const vel = ac.gs ? Math.round(ac.gs * 1.852) + " km/h" : "—";
            frissitTerkep(lat, lon);
            document.getElementById("alt").textContent = alt;
            document.getElementById("vel").textContent = vel;
            const now = new Date().toLocaleTimeString("hu-HU");
            document.getElementById("status").innerHTML =
              'Élő pozíció – utoljára frissítve: <span>' + now + '</span>';
          } else {
            tryNext();
          }
        })
        .catch(() => tryNext());
    }
    tryNext();
  }

  // induláskor: ha van kezdő koordináta, azonnal mutatjuk
  if (initLat && initLon) {
    initMap(initLat, initLon);
    document.getElementById("btn-gmaps").href =
      "https://www.google.com/maps/search/?api=1&query=" + initLat + "," + initLon;
  } else {
    document.getElementById("map-container").innerHTML =
      '<div class="no-coord">📡 Koordináta betöltése az API-ból...</div>';
    document.getElementById("btn-gmaps").style.display = "none";
  }

  // élő pozíció lekérése és 30 másodpercenkénti frissítés
  lekerdezEloPozicio();
  setInterval(lekerdezEloPozicio, 30000);
</script>
</body>
</html>
