name: 🚂 MÁV/Volán Monitor

on:
  workflow_dispatch:
  repository_dispatch:
    types: [mav_trigger]

jobs:
  figyel:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install requests beautifulsoup4

      - name: 🚂 MÁV monitor futtatása
        env:
          EMAIL_KULDO:   ${{ secrets.EMAIL_KULDO }}
          EMAIL_JELSZO:  ${{ secrets.EMAIL_JELSZO }}
          EMAIL_CIMZETT: ${{ secrets.EMAIL_CIMZETT }}
        run: python mav_monitor.py

      - name: 💾 Állapot commitolása (retry, ütközésbiztos)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f mav_allapot.json ]; then
            echo "mav_allapot.json nem létezik, nincs mit commitolni."
            exit 0
          fi

          # Mentsük el a saját, frissen generált állapotfájlt biztonságos helyre,
          # hogy semmilyen git művelet ne tudja véletlenül felülírni/eldobni
          cp mav_allapot.json /tmp/mav_allapot_sajat.json

          SIKERULT=0
          for i in 1 2 3 4 5 6; do
            echo "Push kísérlet $i/6..."

            # Mindig friss állapotból induljunk: eldobjuk a helyi (esetleg
            # elavult) verziót, és a remote legfrissebb állapotára állunk
            git fetch origin main
            git reset --hard origin/main

            # Most ráírjuk a SAJÁT, frissen mentett állapotfájlunkat
            cp /tmp/mav_allapot_sajat.json mav_allapot.json
            git add mav_allapot.json

            if git diff --staged --quiet; then
              echo "Nincs tényleges változás a remote-hoz képest, kész."
              SIKERULT=1
              break
            fi

            git commit -m "mav állapot [skip ci]"

            if git push origin HEAD:main; then
              echo "Push sikeres."
              SIKERULT=1
              break
            else
              echo "Push ütközött (másik workflow közben pusholt), újrapróbálkozás..."
              sleep $((RANDOM % 6 + 2))
            fi
          done

          if [ "$SIKERULT" != "1" ]; then
            echo "⚠️ FIGYELEM: 6 próbálkozás után sem sikerült a push. Az állapot elveszhet ennél a futásnál, de a monitor a következő futásnál újra próbálkozik."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: 🗑️ Régi futások törlése
        if: always()
        run: |
          gh run list --workflow=mav_monitor.yml --limit 50 \
            --json databaseId,status \
            --jq '.[] | select(.status=="completed") | .databaseId' | \
            tail -n +6 | \
            xargs -I {} gh run delete {} --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: ⏱️ Várakozás 60 másodpercet
        if: always()
        run: sleep 60

      - name: 🔄 Következő futás indítása
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"mav_trigger"}'
