name: probe munkasotthon
on:
  push:
    branches: [claude/munkasotthon-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -m 30 -A "Mozilla/5.0" -o /tmp/o -w "HTTP %{http_code} %{content_type} size %{size_download}\n" "https://www.programturizmus.hu/partner-csepeli-munkasotthon-muvelodesi-haz.html"
          python3 probe/p.py
