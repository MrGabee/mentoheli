name: probe munkasotthon
on:
  push:
    branches: [claude/munkasotthon-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in partner-csepeli-munkasotthon-muvelodesi-haz ajanlat-barba-negra-blue-stage-programok ajanlat-barba-negra-red-stage-programok; do
            echo "################################ $u"
            curl -sSL -m 30 -A "Mozilla/5.0" -o /tmp/o -w "HTTP %{http_code} size %{size_download}\n" "https://www.programturizmus.hu/$u.html"
            python3 probe/p.py
          done
