name: probe munkasotthon
on:
  push:
    branches: [claude/munkasotthon-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          pip -q install requests beautifulsoup4
          python3 probe/p.py
