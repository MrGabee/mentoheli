name: probe munkasotthon
on:
  push:
    branches: [claude/munkasotthon-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -m 30 -A "Mozilla/5.0" -o /tmp/o -w "HTTP %{http_code} %{content_type} size %{size_download}\n" "https://www.barbanegra.hu/programok"
          python3 probe/p.py
          grep -oE '(https?://[^"]*)?/(api|wp-json|_next|graphql)[^" ]*' /tmp/o | sort -u | head -20
          grep -oE 'href="[^"]*event[^"]*"' /tmp/o | sort -u | head -20
          for u in "https://www.barbanegra.hu/wp-json/tribe/events/v1/events?per_page=2" "https://www.barbanegra.hu/feed/"; do echo "== $u"; curl -sSL -m 20 -A "Mozilla/5.0" -w "\nHTTP %{http_code} %{content_type}\n" "$u" | head -c 1500; echo; done
