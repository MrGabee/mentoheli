name: 📊 Make Keret Figyelő

on:
  workflow_dispatch:
  schedule:
    # Naponta 9:00 körül (magyar idő)
    - cron: '0 7 * * *'

jobs:
  ellenoriz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: 📊 Keretek ellenőrzése
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE2_API_TOKEN: ${{ secrets.MAKE2_API_TOKEN }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          EMAIL_KULDO: ${{ secrets.EMAIL_KULDO }}
          EMAIL_JELSZO: ${{ secrets.EMAIL_JELSZO }}
          EMAIL_CIMZETT: ${{ secrets.EMAIL_CIMZETT }}
        run: python make_keret_figyelo.py
