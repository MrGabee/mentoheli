name: 🛡️ Őrző - Monitorok Ellenőrzése

on:
  workflow_dispatch:
  repository_dispatch:
    types: [orzo_trigger]
  schedule:
    # Biztonsági háló, ha maga az őrző-lánc szakadna meg
    - cron: '*/15 * * * *'

concurrency:
  group: orzo-monitor
  cancel-in-progress: false

jobs:
  ellenoriz:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🔍 Workflow-k ellenőrzése és leállt lánc újraindítása
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set +e

          # Ezeket a workflow-kat figyeli az őrző (megjelenített név szerint).
          # Ha valamelyik túl régen futott, azt automatikusan újraindítja.
          # Másik repóban lévő workflow "tulajdonos/repo|Név" alakban adható
          # meg (ehhez a PAT_TOKEN-nek arra a repóra is jogosultnak kell lennie).
          FIGYELT_WORKFLOWOK=(
            "⚡ Csepel Áramszünet Monitor"
            "🚌 BKK Kijelző Figyelő"
            "🚧 BKK KÖZÚT-i (bal)eset Monitor"
            "🔥 FŐTÁV Monitor"
            "🚂 MÁV/Volán Monitor"
            "🚁 Mentőhelikopter Monitor"
            "🚔 Police.hu Figyelő (XX./XXI. kerület)"
            "🚔 Rendőrség Baleseti Hírek Monitor"
            "💰 Számla Figyelő (Vízművek / MVM / Díjnet)"
            "💧 Vízművek Monitor"
            "📷 Windy Webkamerák Frissítése (HU)"
            "MrGabee/balesetinfo|🚨 VÉSZ Események Frissítése"
          )

          # Ha egy workflow utolsó futása ennél régebbi (percben), leállítottnak
          # tekintjük és újraindítjuk.
          LEALLTNAK_SZAMIT_PERC=6

          # Ha épp fut vagy sorban áll egy futás, a lánc él, nem indítjuk újra
          # (különben a hosszú futású láncokat, pl. Police.hu, feleslegesen
          # duplán indítanánk). A beragadt, régi "queued" futásokat viszont
          # figyelmen kívül hagyjuk, ezért csak az ennél frissebbeket nézzük.
          AKTIV_FUTAS_MAX_PERC=30

          SAJAT_REPO="${{ github.repository }}"
          MOST=$(date -u +%s)

          echo "🔍 Ellenőrzés indul"
          echo ""

          # Repónként egyszer kérdezzük le a workflow-listát, hogy megjelenített
          # névből meg tudjuk találni az ID-t
          declare -A WORKFLOW_LISTA

          for BEJEGYZES in "${FIGYELT_WORKFLOWOK[@]}"; do
            if [[ "$BEJEGYZES" == *"|"* ]]; then
              REPO="${BEJEGYZES%%|*}"
              NEV="${BEJEGYZES#*|}"
            else
              REPO="$SAJAT_REPO"
              NEV="$BEJEGYZES"
            fi
            echo "── $NEV ($REPO) ──"

            if [ -z "${WORKFLOW_LISTA[$REPO]}" ]; then
              WORKFLOW_LISTA[$REPO]=$(curl -s -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$REPO/actions/workflows?per_page=100")
            fi

            WF_ID=$(echo "${WORKFLOW_LISTA[$REPO]}" | jq -r --arg nev "$NEV" '.workflows[]? | select(.name == $nev) | .id' | head -n1)

            if [ -z "$WF_ID" ]; then
              echo "   ⚠️  Nem található ilyen nevű workflow (vagy nincs hozzáférés), kihagyva."
              echo ""
              continue
            fi

            UTOLSO_FUTASOK=$(curl -s -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID/runs?per_page=10")

            LETREHOZVA=$(echo "$UTOLSO_FUTASOK" | jq -r '.workflow_runs[0].created_at // empty')

            if [ -z "$LETREHOZVA" ]; then
              echo "   ⚠️  Nincs korábbi futás - kihagyva."
              echo ""
              continue
            fi

            FUTAS_IDOPONT=$(date -u -d "$LETREHOZVA" +%s 2>/dev/null)
            KULONBSEG_PERC=$(( (MOST - FUTAS_IDOPONT) / 60 ))

            AKTIV_DB=$(echo "$UTOLSO_FUTASOK" | jq --argjson most "$MOST" --argjson max "$AKTIV_FUTAS_MAX_PERC" \
              '[.workflow_runs[]? | select(.status != "completed")
                | select(($most - (.created_at | fromdateiso8601)) < ($max * 60))] | length')

            echo "   Utolsó futás: $LETREHOZVA ($KULONBSEG_PERC perce), folyamatban: ${AKTIV_DB:-0}"

            if [ "${AKTIV_DB:-0}" -gt 0 ]; then
              echo "   ✅ Épp fut vagy sorban áll, nincs teendő."
            elif [ "$KULONBSEG_PERC" -ge "$LEALLTNAK_SZAMIT_PERC" ]; then
              echo "   ❌ Leállt (>= $LEALLTNAK_SZAMIT_PERC perc) - újraindítás..."
              INDITAS_HTTP=$(curl -s -o /tmp/orzo_resp.txt -w "%{http_code}" -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID/dispatches" \
                -d '{"ref":"main"}')
              if [ "$INDITAS_HTTP" = "204" ]; then
                echo "   ✅ Sikeresen újraindítva."
              else
                echo "   ⚠️  Az újraindítás sikertelen (HTTP $INDITAS_HTTP):"
                cat /tmp/orzo_resp.txt
              fi
            else
              echo "   ✅ Rendben fut, nincs teendő."
            fi
            echo ""
          done

      - name: ⏱️ Várakozás
        if: always()
        run: sleep 100

      - name: 🔄 Az őrző-lánc folytatása
        if: always()
        run: |
          set +e
          SIKERULT=0
          for i in 1 2 3; do
            HTTP_KOD=$(curl -s -o /tmp/orzo_dispatch.txt -w "%{http_code}" -X POST \
              -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"orzo_trigger"}')
            if [ "$HTTP_KOD" = "204" ]; then
              echo "✅ Őrző-lánc folytatva."
              SIKERULT=1
              break
            else
              echo "⚠️ Sikertelen (HTTP $HTTP_KOD), próbálkozás $i/3..."
              cat /tmp/orzo_dispatch.txt
              sleep 5
            fi
          done
          if [ "$SIKERULT" != "1" ]; then
            echo "❌ Nem sikerült folytatni a láncot - a schedule biztonsági háló legfeljebb 15 percen belül úgyis újraindítja."
          fi
