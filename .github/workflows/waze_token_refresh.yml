name: 🔑 Waze Token Frissítő (Önindító)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [waze_token_trigger]
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: waze-token-refresh
  cancel-in-progress: false

jobs:
  token_refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🌐 Playwright telepítése
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 🔑 Token és sütik kinyerése
        run: |
          python3 - << 'EOF'
          import json
          from playwright.sync_api import sync_playwright

          token = None
          cookies = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
              )
              page = context.new_page()
              captured = []

              def handle_request(request):
                  if "georss" in request.url:
                      t = request.headers.get("x-recaptcha-token", "")
                      if t:
                          captured.append(t)

              page.on("request", handle_request)
              try:
                  page.goto("https://www.waze.com/hu/live-map", wait_until="networkidle", timeout=25000)
                  page.wait_for_timeout(4000)
              except: pass
              
              if captured: token = captured[-1]
              cookies = context.cookies()
              browser.close()

          if token and cookies:
              with open("waze_session.json", "w") as f:
                  json.dump({"token": token, "cookies": {c['name']: c['value'] for c in cookies}}, f, indent=2)
          else:
              exit(1)
          EOF

      - name: 💾 Adatok commitolása és .nojekyll létrehozása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          
          # Üres .nojekyll fájl létrehozása, hogy a GitHub Pages ne szűrje a JSON-t
          touch .nojekyll
          
          git add waze_session.json .nojekyll
          git diff --staged --quiet || git commit -m "waze session és nojekyll frissítés [skip ci]"
          git push origin HEAD:main

      - name: ⏱️ Várakozás 60 másodpercet
        run: sleep 60

      - name: 🔄 Következő futás indítása
        run: |
          curl -s -X POST -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"waze_token_trigger"}'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
