- name: 🔑 Token és sütik folyamatos kinyerése
        run: |
          python3 - << 'EOF'
          import json
          import time
          from playwright.sync_api import sync_playwright

          print("Waze token frissítő háttérfolyamat elindítva...")

          while True:
              token = None
              cookies = []
              try:
                  with sync_playwright() as p:
                      browser = p.chromium.launch(headless=True)
                      context = browser.new_context(
                          user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
                      )
                      page = context.new_page()

                      captured = []

                      def handle_request(request):
                          if "georss" in request.url:
                              t = request.headers.get("x-recaptcha-token", "")
                              if t:
                                  captured.append(t)

                      page.on("request", handle_request)

                      page.goto("https://www.waze.com/hu/live-map", wait_until="networkidle", timeout=25000)
                      page.wait_for_timeout(4000)

                      if captured:
                          token = captured[-1]
                      
                      cookies = context.cookies()
                      browser.close()

                  if token and cookies:
                      data = {
                          "token": token,
                          "cookies": {c['name']: c['value'] for c in cookies}
                      }
                      with open("waze_session.json", "w") as f:
                          json.dump(data, f, indent=2)
                      print("Token és sütik frissítve.")
                  else:
                      print("Nem sikerült kinyerni a tokent ebben a körben.")
              except Exception as e:
                  print(f"Hiba történt: {e}")

              print("Várakozás 60 másodpercet a következő frissítésig...")
              time.sleep(60)
          EOF
