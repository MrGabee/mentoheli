name: 🩺 SMTP diagnosztika (ideiglenes)

on:
  push:
    branches: [claude/project-thread-hsrymn]
    paths: [.github/workflows/smtp_diag.yml]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Gmail SMTP bejelentkezés próbája
        env:
          EMAIL_KULDO:  ${{ secrets.EMAIL_KULDO }}
          EMAIL_JELSZO: ${{ secrets.EMAIL_JELSZO }}
        run: |
          python3 - <<'PY'
          import os, smtplib, socket
          u = os.environ.get("EMAIL_KULDO", ""); p = os.environ.get("EMAIL_JELSZO", "")
          print("küldő hossza:", len(u), "domain:", u.split("@")[-1] if "@" in u else "?")
          print("jelszó hossza:", len(p), "szóközt tartalmaz:", " " in p)
          print("runner IP:", socket.gethostbyname(socket.gethostname()))
          for nev, fn in [("465 SSL", lambda: smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=20)),
                          ("587 STARTTLS", lambda: smtplib.SMTP("smtp.gmail.com", 587, timeout=20))]:
              try:
                  s = fn()
                  if nev.startswith("587"):
                      s.ehlo(); s.starttls()
                  s.ehlo()
                  print(nev, "EHLO auth:", s.esmtp_features.get("auth"))
                  s.login(u, p)
                  print(nev, "✅ LOGIN OK")
                  s.quit()
              except smtplib.SMTPResponseException as e:
                  print(nev, "❌ SMTP válasz:", e.smtp_code, e.smtp_error)
              except Exception as e:
                  print(nev, "❌", type(e).__name__, e)
          PY
