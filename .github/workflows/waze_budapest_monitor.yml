name: 🚗 Waze Baleset Monitor - Budapest
on:
  workflow_dispatch:
  repository_dispatch:
    types: [waze_budapest_trigger]
  schedule:
    # Biztonsági háló: ha az önindító lánc bármi okból megszakadna
    # (pl. lejárt token, GitHub API hiba), ez legkésőbb 10 percen
    # belül újraindítja a monitorozást.
    - cron: '*/10 * * * *'
concurrency:
  group: waze-budapest-monitor
  cancel-in-progress: false
jobs:
  figyel:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-jammy
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 📦 Függőségek telepítése
        run: |
          pip install playwright==1.61.0

      - name: 🚗 Waze Budapest monitor futtatása
        env:
          EMAIL_KULDO:        ${{ secrets.EMAIL_KULDO }}
          EMAIL_JELSZO:       ${{ secrets.EMAIL_JELSZO }}
          EMAIL_CIMZETT_WAZE: ${{ secrets.EMAIL_CIMZETT_WAZE }}
          TESZT_MOD: "1"
        run: python waze_budapest_monitor.py

      - name: 💾 Állapot commitolása
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f waze_budapest_allapot.json ]; then
            echo "Nincs állapotfájl, nincs mit commitolni."
            exit 0
          fi
          cp waze_budapest_allapot.json /tmp/waze_budapest_allapot_sajat.json
          SIKERULT=0
          for i in 1 2 3 4 5 6; do
            echo "Push kísérlet $i/6..."
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/waze_budapest_allapot_sajat.json waze_budapest_allapot.json
            git add waze_budapest_allapot.json
            if git diff --staged --quiet; then
              echo "Nincs változás, kész."
              SIKERULT=1
              break
            fi
            git commit -m "waze budapest allapot [skip ci]"
            if git push origin HEAD:main; then
              SIKERULT=1
              break
            else
              sleep $((RANDOM % 6 + 2))
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: ⏱️ Várakozás
        if: always()
        run: sleep 30

      - name: 🔄 Következő futás indítása
        if: always()
        run: |
          SIKERULT=0
          for i in 1 2 3; do
            HTTP_KOD=$(curl -s -o /tmp/dispatch_resp.txt -w "%{http_code}" -X POST \
              -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/dispatches \
              -d '{"event_type":"waze_budapest_trigger"}')
            if [ "$HTTP_KOD" = "204" ]; then
              echo "✅ Dispatch sikeres."
              SIKERULT=1
              break
            else
              echo "⚠️ Dispatch sikertelen (HTTP $HTTP_KOD), próbálkozás $i/3..."
              cat /tmp/dispatch_resp.txt
              sleep 5
            fi
          done
          if [ "$SIKERULT" != "1" ]; then
            echo "❌ FIGYELEM: nem sikerült elindítani a következő futást! A schedule biztonsági háló legfeljebb 15 percen belül úgyis újraindítja a monitort."
          fi
