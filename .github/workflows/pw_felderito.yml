name: Playwright felderítő (ideiglenes, nem posztol)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Betöltendő oldal"
        default: "https://www.utinform.hu/hu/news/balesetek-torlodasok-rendkivuli-kozlekedesi-esemenyek?d=0"
      fetch:
        description: "Az oldal kontextusából lekérendő URL-ek (szóközzel)"
        default: ""

jobs:
  proba:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-jammy
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright==1.61.0
      - run: python eszkozok/pw_felderito.py
        env:
          URL: ${{ inputs.url }}
          FETCH: ${{ inputs.fetch }}
