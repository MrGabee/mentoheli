name: 🧪 Waze teszt Windows-on (otthoni IP)

# Egyszeri kísérlet: ugyanaz a monitor tesztmódban, de valódi Windows + Chrome
# böngészővel, az otthoni routeren (WG_CONFIG) keresztül. Semmit nem ment,
# nem küld e-mailt. Beolvasztás előtt törlendő.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/waze_windows_teszt.yml'

jobs:
  teszt:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 📦 Telepítés
        run: |
          pip install playwright
          python -m playwright install chromium
      - name: 🚗 Teszt az otthoni routeren át
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
          TESZT_MOD: "1"
          EMAIL_TESZT: "0"
          FUTASIDO_PERC: "8"
          KOR_MP: "60"
          FEJLES: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          T="$RUNNER_TEMP"
          curl -fsSL -o "$T/wp.tgz" https://github.com/pufferffish/wireproxy/releases/latest/download/wireproxy_windows_amd64.tar.gz
          tar xzf "$T/wp.tgz" -C "$T"
          printf '%s\n' "$WG_CONFIG" > "$T/wg.conf"
          printf 'WGConfig = %s\n\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' "$(cygpath -w "$T/wg.conf")" > "$T/wireproxy.conf"
          "$T/wireproxy.exe" -s -c "$T/wireproxy.conf" &
          sleep 8
          KOZVETLEN=$(curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep '^ip=')
          ALAGUT=$(curl -fsS --max-time 10 --socks5-hostname 127.0.0.1:25344 https://www.cloudflare.com/cdn-cgi/trace | grep '^ip=' || true)
          if [ -z "$ALAGUT" ]; then echo "❌ Az otthoni router nem érhető el."; exit 1; fi
          [ "$KOZVETLEN" != "$ALAGUT" ] && echo "✅ Más IP-ről megyünk ki, mint a runner (otthoni út)." || echo "⚠️ Ugyanaz az IP, mint a runneré!"
          PROXY_SZERVER=socks5://127.0.0.1:25344 python -u waze_budapest_monitor.py
