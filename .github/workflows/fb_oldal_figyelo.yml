name: 📣 Facebook-oldal Figyelő

on:
  workflow_dispatch:
  schedule:
    # 5 percenként indul (a GitHub ennél sűrűbben nem tud), futásonként kétszer néz rá
    # a figyelt oldalakra (fb_oldalak.json), így kb. 2,5 percenként frissül
    - cron: '2-59/5 * * * *'

concurrency:
  group: fb-oldal-figyelo
  cancel-in-progress: false

jobs:
  figyel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install requests beautifulsoup4

      - name: 🌉 RSS-Bridge indítása (Facebook-oldalak olvasásához)
        run: |
          docker run -d --name rssbridge -p 3000:80 -e RSSBRIDGE_system_enabled_bridges='FacebookBridge' rssbridge/rss-bridge:latest
          for i in $(seq 1 30); do curl -sf -o /dev/null 'http://localhost:3000/' && break; sleep 1; done

      - name: 📣 Oldal figyelő futtatása
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          python fb_oldal_figyelo.py
          sleep 150
          python fb_oldal_figyelo.py

      - name: 💾 Állapot commitolása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase -X ours origin main || (git rebase --abort; git pull origin main --no-rebase -X ours)
          git stash pop || true
          [ -f fb_oldal_allapot.json ] && git add fb_oldal_allapot.json || echo "fájl nem létezik"
          [ -f csendes_ablak.json ] && git add csendes_ablak.json || true
          git diff --staged --quiet || git commit -m "fb oldal figyelő állapot [skip ci]"
          for i in 1 2 3 4 5; do git push origin main && break; echo "push elutasítva, újrapróbálom ($i)"; git pull --rebase -X theirs origin main || git rebase --abort; sleep $((i*3)); done
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
