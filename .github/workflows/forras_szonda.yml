name: Forrás szonda (ideiglenes)
on:
  push:
    branches: [claude/project-thread-6wmvph]
    paths: ['windy/szonda/**.py', 'windy/fetch_argos_webcams.py', '.github/workflows/forras_szonda.yml']
permissions:
  contents: write
jobs:
  szonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python windy/fetch_argos_webcams.py
        timeout-minutes: 40
      - run: python windy/szonda/argos_minta.py
        timeout-minutes: 30
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add windy/szonda/*.json windy/data/webcams_argos.json windy/data/argos_forras.json && git commit -m "szonda eredmény [skip ci]" && git pull --rebase origin claude/project-thread-6wmvph && git push
