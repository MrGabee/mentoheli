name: Forrás szonda (ideiglenes)
on:
  push:
    branches: [claude/project-thread-6wmvph]
    paths: ['windy/szonda/**', '.github/workflows/forras_szonda.yml']
jobs:
  szonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python windy/szonda/argos_elemzes.py
