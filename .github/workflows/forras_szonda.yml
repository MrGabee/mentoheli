name: Forrás szonda (ideiglenes)
on:
  push:
    branches: [claude/project-thread-6wmvph]
    paths: ['windy/szonda/**.py', '.github/workflows/forras_szonda.yml']
permissions:
  contents: write
jobs:
  szonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python windy/szonda/argos_js.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add windy/szonda/*.json && git commit -m "szonda eredmény [skip ci]" && git push
