name: Törölt fájlok visszaállítása

# Egyszeri mentőakció: a futás saját kulcspárt készít, a nyilvános felét
# ide teszi, megvárja, hogy a titkosított csomag megérkezzen a repóba,
# kibontja, és FTP-n visszatölti a fájlokat. A privát kulcs sosem hagyja
# el a futást, így a csomag tartalma (jelszavak) nem válik nyilvánossá.
on:
  push:
    branches: [claude/project-thread-qh8yy9]
    paths: [.github/workflows/visszaallitas.yml]

permissions:
  contents: write

jobs:
  visszaallitas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Kulcs közzététele, csomag megvárása
        run: |
          set -e
          mkdir -p .github/visszaallitas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/priv.pem 2>/dev/null
          openssl pkey -in /tmp/priv.pem -pubout -out .github/visszaallitas/kulcs.pem
          rm -f .github/visszaallitas/csomag.enc .github/visszaallitas/csomag.kulcs.enc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/visszaallitas && git commit -m "Visszaállítás: nyilvános kulcs ${GITHUB_RUN_ID}" && git push
          for i in $(seq 1 120); do
            git pull -q --rebase origin claude/project-thread-qh8yy9
            if [ -f .github/visszaallitas/csomag.kulcs.enc ]; then break; fi
            sleep 10
          done
          openssl pkeyutl -decrypt -inkey /tmp/priv.pem -in .github/visszaallitas/csomag.kulcs.enc -out /tmp/k.txt
          openssl enc -d -aes-256-cbc -pbkdf2 -in .github/visszaallitas/csomag.enc -pass file:/tmp/k.txt | tar -xz -C /tmp
          ls -la /tmp/mentes/*
      - name: mrgabee.hu visszatöltése
        env:
          SZERVER: ${{ secrets.MRGABEE_FTP_SERVER }}
          FELHASZNALO: ${{ secrets.MRGABEE_FTP_USER }}
          JELSZO: ${{ secrets.MRGABEE_FTP_PASSWORD }}
        run: |
          set -e
          host="${SZERVER#ftp://}"; host="${host#ftps://}"; host="${host%/}"
          cd /tmp/mentes/mrgabee.hu
          parancs="set ftp:ssl-allow no; set net:max-retries 3;"
          for f in *; do case "$f" in _lista*|_mappak.txt) continue;; esac; parancs="$parancs put \"$f\";"; echo "feltöltés: $f ($(stat -c %s "$f") bájt)"; done
          lftp -u "$FELHASZNALO","$JELSZO" "$host" -e "$parancs cls -la; bye"
      - name: baloghgabor.hu visszatöltése
        env:
          SZERVER: ${{ secrets.BALOGHGABOR_FTP_SERVER }}
          FELHASZNALO: ${{ secrets.BALOGHGABOR_FTP_USER }}
          JELSZO: ${{ secrets.BALOGHGABOR_FTP_PASSWORD }}
        run: |
          set -e
          host="${SZERVER#ftp://}"; host="${host#ftps://}"; host="${host%/}"
          cd /tmp/mentes/baloghgabor.hu
          parancs="set ftp:ssl-allow no; set net:max-retries 3;"
          for f in *; do case "$f" in _lista*|_mappak.txt) continue;; esac; parancs="$parancs put \"$f\";"; echo "feltöltés: $f ($(stat -c %s "$f") bájt)"; done
          lftp -u "$FELHASZNALO","$JELSZO" "$host" -e "$parancs cls -la; bye"
      - name: Ellenőrzés
        if: always()
        run: |
          for u in https://baleset-info.hu/ https://mrgabee.hu/ https://baloghgabor.hu/ https://mrgabee.hu/aramszunet.png https://baleset-info.hu/banner.png; do printf '%s ' $u; curl -s -o /dev/null -w '%{http_code} %{size_download}\n' $u; done
          git rm -q -f .github/visszaallitas/csomag.enc .github/visszaallitas/csomag.kulcs.enc || true
          git commit -q -m "Visszaállítás kész ${GITHUB_RUN_ID}" && git push || true
