name: 🎭 Csili Program Figyelő

on:
  workflow_dispatch:
  schedule:
    # Félóránként nézi a csili.hu új eseményeit; az emlékeztetőt
    # az esemény előtti napon reggel 9 után küldi ki
    - cron: '*/30 * * * *'

concurrency:
  group: csili-monitor
  cancel-in-progress: false

jobs:
  figyel:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install requests

      - name: 🎭 Csili figyelő futtatása
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python csili.py

      - name: 💾 Állapot commitolása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase -X ours origin main || (git rebase --abort; git pull origin main --no-rebase -X ours)
          git stash pop || true
          [ -f csili_allapot.json ] && git add csili_allapot.json || echo "fájl nem létezik"
          git diff --staged --quiet || git commit -m "csili állapot [skip ci]"
          git push origin main || true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
