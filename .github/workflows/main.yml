name: 🚁 Mentőhelikopter Monitor

on:
  workflow_dispatch:
  repository_dispatch:
    types: [mentoheli_trigger]

jobs:
  figyel:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4

      - name: 💾 Állapot visszaállítása (cache)
        uses: actions/cache@v4
        with:
          path: allapot.json
          key: mentohelikopter-allapot-${{ runner.os }}
          restore-keys: |
            mentohelikopter-allapot-

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install requests

      - name: 🚁 Monitor futtatása
        env:
          EMAIL_KULDO:   ${{ secrets.EMAIL_KULDO }}
          EMAIL_JELSZO:  ${{ secrets.EMAIL_JELSZO }}
          EMAIL_CIMZETT: ${{ secrets.EMAIL_CIMZETT }}
        run: python monitor.py

      - name: 💾 Állapot mentése (cache)
        uses: actions/cache@v4
        if: always()
        with:
          path: allapot.json
          key: mentohelikopter-allapot-${{ runner.os }}

      # 60 másodpercet vár, majd újraindítja magát
      - name: ⏱️ Várakozás 60 másodpercet
        if: always()
        run: sleep 60

      - name: 🔄 Következő futás indítása
        if: always()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"mentoheli_trigger"}'
