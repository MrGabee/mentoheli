name: 🚁 Mentőhelikopter Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  figyel:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4

      - name: 💾 Állapot visszaállítása (cache)
        uses: actions/cache@v4
        with:
          path: allapot.json
          key: mentohelikopter-allapot-${{ runner.os }}
          restore-keys: |
            mentohelikopter-allapot-

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install requests

      - name: 🚁 Monitor futtatása
        env:
          EMAIL_KULDO:   ${{ secrets.EMAIL_KULDO }}
          EMAIL_JELSZO:  ${{ secrets.EMAIL_JELSZO }}
          EMAIL_CIMZETT: ${{ secrets.EMAIL_CIMZETT }}
        run: python monitor.py

      - name: 💾 Állapot mentése (cache)
        uses: actions/cache@v4
        if: always()
        with:
          path: allapot.json
          key: mentohelikopter-allapot-${{ runner.os }}
