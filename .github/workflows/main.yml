name: 🚁 Mentőhelikopter Monitor

on:
  workflow_dispatch:
  repository_dispatch:
    types: [mentoheli_trigger]

jobs:
  figyel:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4

      - name: 📂 Állapot fájl ellenőrzése
        run: |
          if [ -f "allapot.json" ]; then
            echo "✅ Állapot fájl megvan: $(wc -c < allapot.json) byte"
          else
            echo "📭 Nincs állapot fájl, első futás."
          fi

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install requests

      - name: 🚁 Monitor futtatása
        env:
          EMAIL_KULDO:   ${{ secrets.EMAIL_KULDO }}
          EMAIL_JELSZO:  ${{ secrets.EMAIL_JELSZO }}
          EMAIL_CIMZETT: ${{ secrets.EMAIL_CIMZETT }}
        run: python monitor.py

      - name: 💾 Állapot fájl commitolása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allapot.json
          git diff --staged --quiet || git commit -m "állapot frissítés [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: ⏱️ Várakozás 60 másodpercet
        if: always()
        run: sleep 60

      - name: 🔄 Következő futás indítása
        if: always()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"mentoheli_trigger"}'
