name: ⚽ Sport forrás próba

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Próba (nem posztol)
        run: |
          pip install -q requests tzdata
          python csepeli_sport.py elozetes
          python -c "
          import csepeli_sport as cs
          from datetime import date
          m = cs.osszes_meccs()
          print(cs.eredmeny_szoveg(date(2026, 10, 19), m))
          print(cs.elozetes_szoveg(date(2026, 10, 23), m))
          "
