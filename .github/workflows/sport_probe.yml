name: ⚽ Sport forrás próba

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Források
        run: |
          python3 - <<'PY'
          import urllib.request, re, html
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) Chrome/129.0 Safari/537.36"})
              with urllib.request.urlopen(r, timeout=25) as f:
                  return f.status, f.read().decode("utf-8", "replace")
          def szoveg(t):
              t = re.sub(r"(?s)<(script|style|head)[^>]*>.*?</\1>", " ", t)
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", t)))
          for u in ["https://adatbank.mlsz.hu/match/2187785.html",
                    "https://adatbank.mlsz.hu/club/67/0/33753/1/330199.html"]:
              s, t = get(u)
              print("=====", u, s, len(t))
              print("LINKEK:", sorted(set(l for l in re.findall(r'href="([^"]+)"', t) if "/league/" in l or "/club/" in l or "/match/" in l))[:80])
              print("SZOVEG:", szoveg(t)[:5000])
              i = t.lower().find("csepel")
              print("NYERS:", t[max(0,i-3000):i+3000])
          s, t = get("https://www.csepelsc.com/blog-feed.xml")
          print("===== FEED", s, len(t))
          print(t[:3000])
          PY
