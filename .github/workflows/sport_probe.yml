name: ⚽ Sport forrás próba

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Források
        run: |
          python3 - <<'PY'
          import urllib.request, re
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) Chrome/129.0 Safari/537.36"})
              with urllib.request.urlopen(r, timeout=25) as f:
                  return f.status, f.read().decode("utf-8", "replace")
          urls = [
            "https://adatbank.mlsz.hu/",
            "https://adatbank.mlsz.hu/league/62/0/31786/1.html",
            "https://www.csepelfc.hu/", "https://csepelfc.hu/", "https://www.csepelsc.hu/",
            "https://www.magyarfutball.hu/hu/csapat/csepel",
            "https://www.blsz.hu/", "https://blsz.hu/",
            "https://hunfoci.hu/noi-nb2/noi-nb2-keleti-csoport-2026-2027-5-fordulo.html",
          ]
          for u in urls:
              try:
                  s, t = get(u)
                  links = sorted(set(l for l in re.findall(r'href="([^"]+)"', t) if "csepel" in l.lower() or "erzsebet" in l.lower()))[:40]
                  ctx = [t[max(0,m.start()-120):m.start()+120].replace("\n"," ") for m in re.finditer("Csepel", t)][:5]
                  print("=====", u, s, len(t), "csepel:", t.count("Csepel"))
                  print("LINKS", links)
                  for c in ctx: print("CTX", re.sub(r"<[^>]+>"," ",c))
              except Exception as e:
                  print("=====", u, "HIBA", e)
          PY
