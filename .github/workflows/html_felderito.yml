name: HTML felderítő (ideiglenes, nem posztol)

on:
  workflow_dispatch:
    inputs:
      urlek:
        description: "URL-ek szóközzel"
        default: "https://mkosz.hu/csapat-musor/x2627/hun3koa/10837/"
      minta:
        description: "Keresett minta (regex)"
        default: "Csepel"
      ua:
        description: "User-Agent (üres = böngésző)"
        default: ""

jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4
      - run: python eszkozok/mav_minta.py
        env:
          PYTHONPATH: .
          EMAIL_KULDO:   ${{ secrets.EMAIL_KULDO }}
          EMAIL_JELSZO:  ${{ secrets.EMAIL_JELSZO }}
          EMAIL_CIMZETT: ${{ secrets.EMAIL_CIMZETT }}
