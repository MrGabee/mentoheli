name: HTML felderítő (ideiglenes, nem posztol)

on:
  workflow_dispatch:

jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests gtfs-realtime-bindings
      - run: python bkk_menetrend.py
        env:
          ELONEZET: "1"
          BKK_API_KEY: ${{ secrets.BKK_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f bkk_menetrend_elonezet.html
          git commit -qm "előnézet" && git push -q origin HEAD:claude/project-thread-oeicnh
