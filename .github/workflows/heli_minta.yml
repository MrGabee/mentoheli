name: Mentőhelikopter minta levél (ideiglenes, nem küld)

on:
  workflow_dispatch:

jobs:
  minta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4 pillow
      - run: python eszkozok/heli_minta.py
