name: 🚌 BKK Kijelző Figyelő

on:
  workflow_dispatch:
  repository_dispatch:
    types: [bkk_kijelzo_trigger]
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: bkk-kijelzo-figyelo
  cancel-in-progress: false

jobs:
  figyel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install requests gtfs-realtime-bindings

      - name: 🚌 Kijelző-figyelés futtatása
        env:
          EMAIL_KULDO: ${{ secrets.EMAIL_KULDO }}
          EMAIL_JELSZO: ${{ secrets.EMAIL_JELSZO }}
          EMAIL_CIMZETT_BKK: ${{ secrets.EMAIL_CIMZETT_BKK }}
          BKK_API_KULCS: ${{ secrets.BKK_API_KULCS }}
        run: python bkk_kijelzo/bkk_kijelzo_figyelo.py

      - name: 🌐 JSON feltöltése a saját tárhelyre (FTP)
        if: always()
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_JELSZO: ${{ secrets.FTP_JELSZO }}
        run: |
          python - << 'PYEOF'
          import os
          import ftplib

          HOST = os.environ.get("FTP_HOST", "")
          USER = os.environ.get("FTP_USER", "")
          JELSZO = os.environ.get("FTP_JELSZO", "")
          # ⬇️ Írd át a tényleges célmappára a saját tárhelyeden ⬇️
          TAVOLI_MAPPA = "/bkk_kijelzo"
          # Az "aktiv" (élő pillanatkép) mellett az "Előzmények" fülhöz
          # szükséges két fájlt is feltöltjük ide - a bkk_kijelzo_flagek.json
          # NINCS ezek között, mert azt a weboldal közvetlenül a GitHub-ra
          # írja (nem a Python-script hozza létre). A HELYI útvonal a
          # "bkk_kijelzo/" almappát tartalmazza (a script is oda írja őket),
          # de a TÁVOLI (FTP) oldalon a puszta fájlnévvel töltjük fel, a már
          # eleve "/bkk_kijelzo" célmappába - ld. HELYI_FAJLOK feldolgozása lent.
          HELYI_FAJLOK = [
              "bkk_kijelzo/bkk_kijelzo_aktiv.json",
              "bkk_kijelzo/bkk_kijelzo_valtozasok.json",
              "bkk_kijelzo/bkk_kijelzo_utolso_szovegek.json",
          ]

          if not (HOST and USER and JELSZO):
              print("⚠️  Nincs beállítva FTP_HOST/FTP_USER/FTP_JELSZO - feltöltés kihagyva.")
              exit(0)

          letezo_fajlok = [f for f in HELYI_FAJLOK if os.path.exists(f)]
          if not letezo_fajlok:
              print(f"⚠️  Egyik feltöltendő fájl sem létezik ({HELYI_FAJLOK}), nincs mit feltölteni.")
              exit(0)

          try:
              ftp = ftplib.FTP(HOST, timeout=30)
              ftp.login(USER, JELSZO)
              try:
                  ftp.cwd(TAVOLI_MAPPA)
              except ftplib.error_perm:
                  print(f"ℹ️  A {TAVOLI_MAPPA} mappa nem létezik, létrehozom...")
                  ftp.mkd(TAVOLI_MAPPA)
                  ftp.cwd(TAVOLI_MAPPA)

              for helyi_fajl in letezo_fajlok:
                  # A távoli fájlnév a puszta fájlnév (mappa-előtag nélkül) -
                  # a TAVOLI_MAPPA-ba töltjük fel, nem egy "bkk_kijelzo"
                  # nevű almappát próbálunk létrehozni odabent.
                  tavoli_nev = os.path.basename(helyi_fajl)
                  with open(helyi_fajl, "rb") as f:
                      ftp.storbinary(f"STOR {tavoli_nev}", f)
                  print(f"✅ {helyi_fajl} sikeresen feltöltve: {HOST}{TAVOLI_MAPPA}/{tavoli_nev}")
              ftp.quit()
          except Exception as e:
              print(f"⚠️  FTP-feltöltési hiba: {type(e).__name__}: {e}")
          PYEOF

      - name: 💾 Állapot commitolása (önjavító)
        if: always()
        continue-on-error: true
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f bkk_kijelzo_allapot.json ]; then
            echo "Nincs állapotfájl, nincs mit commitolni."
            exit 0
          fi
          cp bkk_kijelzo_allapot.json /tmp/bkk_kijelzo_allapot_sajat.json

          # FONTOS: az aktiv/valtozasok/utolso_szovegek fájlok a "bkk_kijelzo/"
          # ALMAPPÁBAN élnek (a bkk_kijelzo.html mellett), mert a weboldal
          # relatív fetch()-csel tölti be őket - GitHub Pages-en ez azt
          # jelenti, hogy a HTML mellett kell lenniük, különben 404. Az
          # allapot.json és a GTFS-cache viszont MARADNAK a repó gyökerében
          # (őket a böngésző sosem tölti be, csak a script használja).
          VAN_AKTIV_JSON=0
          if [ -f bkk_kijelzo/bkk_kijelzo_aktiv.json ]; then
            cp bkk_kijelzo/bkk_kijelzo_aktiv.json /tmp/bkk_kijelzo_aktiv_sajat.json
            VAN_AKTIV_JSON=1
          fi

          VAN_GTFS_CACHE=0
          if [ -f bkk_vonalszamok_cache.json ]; then
            cp bkk_vonalszamok_cache.json /tmp/bkk_vonalszamok_cache_sajat.json
            VAN_GTFS_CACHE=1
          fi

          # Kijelző-előzmények (ÚJ) - a bkk_kijelzo_flagek.json SZÁNDÉKOSAN
          # NEM szerepel itt: azt a weboldal írja közvetlenül a GitHub-ra
          # (GitHub token + Contents API), ezt a lépést a script sosem
          # módosítja/commitolja, hogy a "git reset --hard origin/main" a
          # legfrissebb (böngészőből mentett) verziót hagyja érintetlenül.
          VAN_VALTOZASOK=0
          if [ -f bkk_kijelzo/bkk_kijelzo_valtozasok.json ]; then
            cp bkk_kijelzo/bkk_kijelzo_valtozasok.json /tmp/bkk_kijelzo_valtozasok_sajat.json
            VAN_VALTOZASOK=1
          fi
          VAN_UTOLSO_SZOVEGEK=0
          if [ -f bkk_kijelzo/bkk_kijelzo_utolso_szovegek.json ]; then
            cp bkk_kijelzo/bkk_kijelzo_utolso_szovegek.json /tmp/bkk_kijelzo_utolso_szovegek_sajat.json
            VAN_UTOLSO_SZOVEGEK=1
          fi

          SIKERULT=0
          for i in 1 2 3 4 5 6; do
            echo "Push kísérlet $i/6..."
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/bkk_kijelzo_allapot_sajat.json bkk_kijelzo_allapot.json
            MENTENDO_FAJLOK="bkk_kijelzo_allapot.json"
            mkdir -p bkk_kijelzo
            if [ "$VAN_AKTIV_JSON" = "1" ]; then
              cp /tmp/bkk_kijelzo_aktiv_sajat.json bkk_kijelzo/bkk_kijelzo_aktiv.json
              MENTENDO_FAJLOK="$MENTENDO_FAJLOK bkk_kijelzo/bkk_kijelzo_aktiv.json"
            fi
            if [ "$VAN_GTFS_CACHE" = "1" ]; then
              cp /tmp/bkk_vonalszamok_cache_sajat.json bkk_vonalszamok_cache.json
              MENTENDO_FAJLOK="$MENTENDO_FAJLOK bkk_vonalszamok_cache.json"
            fi
            if [ "$VAN_VALTOZASOK" = "1" ]; then
              cp /tmp/bkk_kijelzo_valtozasok_sajat.json bkk_kijelzo/bkk_kijelzo_valtozasok.json
              MENTENDO_FAJLOK="$MENTENDO_FAJLOK bkk_kijelzo/bkk_kijelzo_valtozasok.json"
            fi
            if [ "$VAN_UTOLSO_SZOVEGEK" = "1" ]; then
              cp /tmp/bkk_kijelzo_utolso_szovegek_sajat.json bkk_kijelzo/bkk_kijelzo_utolso_szovegek.json
              MENTENDO_FAJLOK="$MENTENDO_FAJLOK bkk_kijelzo/bkk_kijelzo_utolso_szovegek.json"
            fi
            git add $MENTENDO_FAJLOK
            if git diff --staged --quiet; then
              echo "Nincs változás, kész."
              SIKERULT=1
              break
            fi
            git commit -m "bkk kijelző állapot [skip ci]"
            if git push origin HEAD:main; then
              echo "Push sikeres."
              SIKERULT=1
              break
            else
              echo "Push ütközött, újrapróbálkozás..."
              sleep $((RANDOM % 6 + 2))
            fi
          done
          if [ "$SIKERULT" != "1" ]; then
            echo "⚠️ 6 próbálkozás után sem sikerült a push."
          fi

      - name: ⏱️ Várakozás
        if: always()
        run: sleep 5

      - name: 🔄 Következő futás indítása (önjavító)
        if: always()
        continue-on-error: true
        run: |
          set +e
          SIKERULT=0
          for i in 1 2 3; do
            HTTP_KOD=$(curl -s -o /tmp/dispatch_resp.txt -w "%{http_code}" -X POST \
              -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"bkk_kijelzo_trigger"}')
            if [ "$HTTP_KOD" = "204" ]; then
              echo "✅ Dispatch sikeres."
              SIKERULT=1
              break
            else
              echo "⚠️ Dispatch sikertelen (HTTP $HTTP_KOD), próbálkozás $i/3..."
              cat /tmp/dispatch_resp.txt
              sleep 5
            fi
          done
          if [ "$SIKERULT" != "1" ]; then
            echo "❌ Nem sikerült - a schedule biztonsági háló legfeljebb 10 percen belül újraindítja."
          fi
