name: ☀️ Reggeli Összefoglaló

on:
  workflow_dispatch:
  schedule:
    # 05:00 UTC = 07:00 nyári időben, 06:00 téli időben
    - cron: '0 5 * * *'

concurrency:
  group: reggeli-osszefoglalo
  cancel-in-progress: false

jobs:
  osszefoglalo:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install requests beautifulsoup4

      - name: ☀️ Összefoglaló posztolása
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          FB_KVOTA_TOKEN:   ${{ secrets.PAT_TOKEN }}
        run: python reggeli_osszefoglalo.py
