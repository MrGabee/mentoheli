name: ☀️ Reggeli Összefoglaló

on:
  workflow_dispatch:
  schedule:
    # Helyi idő szerint 6:30-kor posztol egész évben. A GitHub UTC-ben
    # ütemez, ezért két időpontban indul; a script dönti el, melyik
    # felel meg aznap a 6:30-nak (nyáron 04:30 UTC, télen 05:30 UTC).
    - cron: '30 4 * * *'
    - cron: '30 5 * * *'

concurrency:
  group: reggeli-osszefoglalo
  cancel-in-progress: false

jobs:
  osszefoglalo:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install requests beautifulsoup4

      - name: ☀️ Összefoglaló posztolása
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          UTEMEZES:         ${{ github.event.schedule }}
        run: python reggeli_osszefoglalo.py
