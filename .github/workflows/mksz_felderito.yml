name: MKSZ felderítő (ideiglenes, nem posztol)

on:
  workflow_dispatch:
    inputs:
      utak:
        description: "API-utak szóközzel (public/api/v1 után)"
        default: "merkozesek/32021361670 versenyek csapatok?nev=Csepel"

jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python eszkozok/mksz_felderito.py
        env:
          UTAK: ${{ inputs.utak }}
