name: katv proba
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A "Mozilla/5.0 Chrome/130" https://www.katasztrofavedelem.hu/30/tegnap-tortent -o k.html
          wc -c k.html
          python3 - <<'PY'
          import re
          h=open('k.html',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'page-title-yesterday|tabindex="0"|<h[1-3][^>]*>|\d{4}\.\s*[a-záéíóöőúüű]+\s*\d{1,2}\.\s*\d{1,2}:\d{2}|class="[^"]*(yesterday|archiv|archive|lead|news|cikk|article)[^"]*"', h):
              s=h[m.start():m.start()+160].replace('\n',' ')
              print(m.start(), re.sub(r'\s+',' ',s))
          PY
