name: police.hu lista próba (ideiglenes)
on: workflow_dispatch
jobs:
  proba:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          for u in "https://www.police.hu/hu/hirek-es-informaciok/legfrissebb-hireink" "https://www.police.hu/hu/hirek-es-informaciok/utinfo/baleseti-hirek"; do
            echo "=================== $u"
            curl -sL -A "$UA" -D /tmp/h -o /tmp/o "$u"; grep -iE "^(last-modified|date|x-drupal-cache|age):" /tmp/h
            python3 -c "import re;h=open('/tmp/o',encoding='utf-8').read();i=h.find('2026. 10.');print(re.sub(r'\s+',' ',h[i-2500:i+1500]))"
          done
