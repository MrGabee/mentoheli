name: police.hu lista próba (ideiglenes)
on: workflow_dispatch
jobs:
  proba:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          for u in "https://www.police.hu/hu/rss/feed" "https://www.police.hu/hu/rss/feed?_=$(date +%s%N)"; do
            echo "=================== $u"
            curl -sL -A "$UA" -H "Cache-Control: no-cache" -D /tmp/h -o /tmp/o "$u"; grep -iE "^(last-modified|x-drupal-cache|x-drupal-dynamic-cache):" /tmp/h; grep -c "<item>" /tmp/o; grep -oE '<pubDate>[^<]+' /tmp/o | head -2
          done
