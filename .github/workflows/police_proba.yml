name: police.hu próba (ideiglenes)
on: workflow_dispatch
jobs:
  proba:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          for u in "https://www.police.hu/hu/rss" \
                   "https://www.police.hu/hu/rss/Baleseti%20h%C3%ADrek" \
                   "https://www.police.hu/hu/rss/Legfrissebb%20h%C3%ADreink" \
                   "https://www.police.hu/hu/hirek-es-informaciok/legfrissebb-hireink" \
                   "https://www.police.hu/hu/hirek-es-informaciok/legfrissebb-hireink/baleseti-hirek"; do
            echo "=================== $u"
            curl -sL -A "$UA" -o /tmp/o -w "HTTP %{http_code} %{size_download}\n" "$u"
            grep -oE 'href="[^"]*rss[^"]*"[^<]*' /tmp/o | sort -u | head -40
            head -c 1500 /tmp/o | tr '\n' ' '; echo
          done
          echo "=================== cikk"
          L=$(curl -sL -A "$UA" "https://www.police.hu/hu/rss/Baleseti%20h%C3%ADrek" | grep -oE '<link>[^<]+' | sed -n 2p | sed 's/<link>//')
          echo "$L"; curl -sL -A "$UA" "$L" -o /tmp/c; grep -nE 'class="[^"]*(field|body|content|article|node)[^"]*"' /tmp/c | head -40
          python3 - <<'P'
          import re;h=open('/tmp/c',encoding='utf-8',errors='ignore').read()
          i=h.find('<h1');print(re.sub(r'\s+',' ',h[i:i+6000]))
          P
