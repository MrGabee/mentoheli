name: 💰 Számla Figyelő (Vízművek / MVM / Díjnet)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Teszt mód (dry run): nem küld emailt, nem menti/pusholja az állapotot - csak naplózza, mit tenne"
        required: false
        default: false
        type: boolean
      datumtol:
        description: "Dátum-intervallumos küldés: kezdő dátum (ÉÉÉÉ-HH-NN) - a dashboard tölti ki, kézzel üresen hagyható"
        required: false
        default: ""
        type: string
      datumig:
        description: "Dátum-intervallumos küldés: záró dátum (ÉÉÉÉ-HH-NN) - a dashboard tölti ki, kézzel üresen hagyható"
        required: false
        default: ""
        type: string
      cel_email:
        description: "Dátum-intervallumos küldés: célcím - a dashboard tölti ki, kézzel üresen hagyható"
        required: false
        default: ""
        type: string
      berlo_osszesito_kor:
        description: "Bérlő 'Küldés most': melyik bérlői kör kapja azonnal a fizetendő-összesítőt - '', 'kor_a', 'kor_b' vagy 'mind' - a dashboard tölti ki, kézzel üresen hagyható"
        required: false
        default: ""
        type: string
      tulajdonos_osszesito:
        description: "Tulajdonos 'Küldés most': azonnal küldje el az ÖSSZES (minden kör) fizetetlen számla összesítőjét a tulajdonosnak"
        required: false
        default: false
        type: boolean
      konyvelo_emlekezteto:
        description: "Könyvelő 'Küldés most': azonnal küldje el a havi Drive-emlékeztetőt a könyvelőnek"
        required: false
        default: false
        type: boolean
      pdf_csatolas_manualis:
        description: "A fenti bérlő/tulajdonos 'Küldés most' azonnali küldésekhez csatolja-e a PDF-eket (a dashboard 'PDF-ek csatolása' jelölőnégyzete)"
        required: false
        default: false
        type: boolean
  schedule:
    # 10 percenként fut. FONTOS - KOCKÁZAT: a dijnet.hu / ugyfelszolgalat.
    # vizmuvek.hu portálokra ilyen gyakori (10 percenkénti) bejelentkezés
    # némi kockázatot hordoz, hogy a portál BOT-SZERŰ forgalomnak minősíti
    # és blokkolja/korlátozza (rate-limit, CAPTCHA, ideiglenes tiltás) - ha
    # a Díjnet/Vízművek-lekérdezés a jövőben rendszeresen hibázna/kiesne,
    # ELSŐKÉNT ezt az ütemezést kell visszavenni (pl. óránkéntire vagy a
    # korábbi napi 3x-ra), mielőtt bármi mást keresnénk a hiba okaként.
    - cron: '*/10 * * * *'

concurrency:
  group: szamla-figyelo
  cancel-in-progress: false

jobs:
  figyel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install cryptography pdfplumber requests beautifulsoup4 lxml

      - name: 💰 Számla figyelő futtatása
        env:
          SZAMLA_IMAP_HOST: ${{ secrets.SZAMLA_IMAP_HOST }}
          SZAMLA_IMAP_USER: ${{ secrets.SZAMLA_IMAP_USER }}
          SZAMLA_IMAP_JELSZO: ${{ secrets.SZAMLA_IMAP_JELSZO }}
          SZAMLA_IMAP_MAPPA: ${{ secrets.SZAMLA_IMAP_MAPPA }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          EMAIL_KULDO_SZAMLA: ${{ secrets.EMAIL_KULDO_SZAMLA }}
          EMAIL_JELSZO_SZAMLA: ${{ secrets.EMAIL_JELSZO_SZAMLA }}
          EMAIL_CIMZETT_SZAMLA: ${{ secrets.EMAIL_CIMZETT_SZAMLA }}
          SZAMLA_TITKOSITAS_JELSZO: ${{ secrets.SZAMLA_TITKOSITAS_JELSZO }}
          SZAMLA_DIJNET_USER: ${{ secrets.SZAMLA_DIJNET_USER }}
          SZAMLA_DIJNET_JELSZO: ${{ secrets.SZAMLA_DIJNET_JELSZO }}
          SZAMLA_VIZMUVEK_USER: ${{ secrets.SZAMLA_VIZMUVEK_USER }}
          SZAMLA_VIZMUVEK_JELSZO: ${{ secrets.SZAMLA_VIZMUVEK_JELSZO }}
          # Bérlői körök - a dashboardon besorolt Díjnet/Vízművek-számlák
          # ide mennek (értesítő + havi összesítő) - ha valamelyik nincs
          # beállítva, az adott kör számláiról egyszerűen nem megy ki email
          # (a script naplózza, de nem áll le emiatt).
          SZAMLA_KOR_A_EMAIL: ${{ secrets.SZAMLA_KOR_A_EMAIL }}
          SZAMLA_KOR_B_EMAIL: ${{ secrets.SZAMLA_KOR_B_EMAIL }}
          # Csak akkor "1", ha valaki kézzel (Run workflow gombbal) bepipálta
          # a "dry_run" opciót - az ütemezett (napi 3x-os) futásoknál mindig
          # üres/false, tehát ott mindig éles módban fut.
          SZAMLA_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
          # Csak workflow_dispatch-nál lehet tartalmuk (a dashboard tölti ki) -
          # ütemezett futásnál mindhárom üres, a script ilyenkor kihagyja az
          # ehhez tartozó szakaszt.
          SZAMLA_DATUMTOL: ${{ (github.event_name == 'workflow_dispatch' && inputs.datumtol) || '' }}
          SZAMLA_DATUMIG: ${{ (github.event_name == 'workflow_dispatch' && inputs.datumig) || '' }}
          SZAMLA_CEL_EMAIL: ${{ (github.event_name == 'workflow_dispatch' && inputs.cel_email) || '' }}
          # 3 CÍMZETTI KÖR - manuális, azonnali "Küldés most" gombok a
          # dashboardról (ld. szamlak.html "Címzettek és azonnali küldés"
          # panelje) - ugyanaz a minta, mint a fenti dátum-intervallumos
          # küldésnél: mindegyik üres/false egy ütemezett futásnál, csak
          # workflow_dispatch-nál kaphat tartalmat.
          SZAMLA_BERLO_OSSZESITO_KOR: ${{ (github.event_name == 'workflow_dispatch' && inputs.berlo_osszesito_kor) || '' }}
          SZAMLA_TULAJDONOS_OSSZESITO_MOST: ${{ (github.event_name == 'workflow_dispatch' && inputs.tulajdonos_osszesito) && '1' || '' }}
          SZAMLA_KONYVELO_EMLEKEZTETO_MOST: ${{ (github.event_name == 'workflow_dispatch' && inputs.konyvelo_emlekezteto) && '1' || '' }}
          SZAMLA_PDF_CSATOLAS_MANUALIS: ${{ (github.event_name == 'workflow_dispatch' && inputs.pdf_csatolas_manualis) && '1' || '' }}
        run: python szamlak/szamla_figyelo.py

      - name: 💾 Állapot commitolása (önjavító)
        if: always()
        continue-on-error: true
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATA_FILE="szamlak/szamla_allapot.enc.json"
          if [ ! -f "$DATA_FILE" ]; then
            echo "Nincs adatfájl, nincs mit commitolni."
            exit 0
          fi
          TMP_COPY="/tmp/szamla_allapot_backup_$$.json"
          cp "$DATA_FILE" "$TMP_COPY"

          SIKERULT=0
          for i in 1 2 3 4 5 6; do
            echo "Push kísérlet $i/6..."
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$DATA_FILE")"
            cp "$TMP_COPY" "$DATA_FILE"
            git add "$DATA_FILE"
            if git diff --staged --quiet; then
              echo "Nincs változás, kész."
              SIKERULT=1
              break
            fi
            git commit -m "számla állapot frissítve (titkosítva) [skip ci]"
            if git push origin HEAD:main; then
              echo "Push sikeres."
              SIKERULT=1
              break
            else
              echo "Push ütközött, újrapróbálkozás..."
              sleep $((RANDOM % 6 + 2))
            fi
          done
          if [ "$SIKERULT" != "1" ]; then
            echo "⚠️ 6 próbálkozás után sem sikerült a push."
          fi
