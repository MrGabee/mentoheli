name: 💰 Számla Figyelő (Vízművek / MVM / Díjnet)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Teszt mód (dry run): nem küld emailt, nem menti/pusholja az állapotot - csak naplózza, mit tenne"
        required: false
        default: false
        type: boolean
      datumtol:
        description: "Dátum-intervallumos küldés: kezdő dátum (ÉÉÉÉ-HH-NN) - a dashboard tölti ki, kézzel üresen hagyható"
        required: false
        default: ""
        type: string
      datumig:
        description: "Dátum-intervallumos küldés: záró dátum (ÉÉÉÉ-HH-NN) - a dashboard tölti ki, kézzel üresen hagyható"
        required: false
        default: ""
        type: string
      cel_email:
        description: "Dátum-intervallumos küldés: célcím - a dashboard tölti ki, kézzel üresen hagyható"
        required: false
        default: ""
        type: string
      berlo_osszesito_kor:
        description: "Bérlő 'Küldés most': melyik bérlői kör kapja azonnal a fizetendő-összesítőt - '', 'kor_a', 'kor_b' vagy 'mind' - a dashboard tölti ki, kézzel üresen hagyható"
        required: false
        default: ""
        type: string
      tulajdonos_osszesito:
        description: "Tulajdonos 'Küldés most': azonnal küldje el az ÖSSZES (minden kör) fizetetlen számla összesítőjét a tulajdonosnak"
        required: false
        default: false
        type: boolean
      konyvelo_emlekezteto:
        description: "Könyvelő 'Küldés most': azonnal küldje el a havi Drive-emlékeztetőt a könyvelőnek"
        required: false
        default: false
        type: boolean
      pdf_csatolas_manualis:
        description: "A fenti bérlő/tulajdonos 'Küldés most' azonnali küldésekhez csatolja-e a PDF-eket (a dashboard 'PDF-ek csatolása' jelölőnégyzete)"
        required: false
        default: false
        type: boolean
      nav_emlekezteto_adoszamok:
        description: "NAV-panel 'Emlékeztető küldése': vesszővel elválasztott adószám-lista, akiknek a dashboard 'Emlékeztető küldése' gombjával kiválasztott, hiányzó-számla-emlékeztetőt kell küldeni - a dashboard tölti ki, kézzel üresen hagyható"
        required: false
        default: ""
        type: string
  schedule:
    # 20 percenként fut. Korábban 10 percenkénti volt, de ez torlódást
    # okozott: a "concurrency" beállítás miatt (ld. lentebb) csak egy
    # futás mehet egyszerre, és egy-egy Díjnet+Vízművek bejelentkezés
    # akár 1-2 percig is eltarthat - emiatt a kézi "Küldés most"
    # gombokkal indított futások rendszeresen csak sokára jutottak
    # sorra. (A dashboard-mentések és a futó Action közötti HTTP 409-
    # ütközés, ami korábban itt is szerepelt indokként, a MySQL-alapú
    # tárolásra állás óta strukturálisan nem tud előfordulni - ld.
    # szamlak/mysql/api.php -, de a 20 perces ütemezést emiatt nem
    # indokolt visszavenni, a "Küldés most" gombok soron kívüliségének
    # kedvéért.) FONTOS - KOCKÁZAT: a dijnet.hu / ugyfelszolgalat.vizmuvek.hu
    # portálokra gyakori bejelentkezés némi kockázatot hordoz, hogy a
    # portál BOT-SZERŰ forgalomnak minősíti és blokkolja/korlátozza
    # (rate-limit, CAPTCHA, ideiglenes tiltás) - ha a Díjnet/Vízművek-
    # lekérdezés a jövőben rendszeresen hibázna/kiesne, ELSŐKÉNT ezt az
    # ütemezést kell tovább visszavenni (pl. óránkéntire vagy a korábbi
    # napi 3x-ra), mielőtt bármi mást keresnénk a hiba okaként.
    - cron: '*/20 * * * *'

concurrency:
  group: szamla-figyelo
  cancel-in-progress: false

jobs:
  figyel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install cryptography pdfplumber requests beautifulsoup4 lxml

      - name: 💰 Számla figyelő futtatása
        env:
          SZAMLA_IMAP_HOST: ${{ secrets.SZAMLA_IMAP_HOST }}
          SZAMLA_IMAP_USER: ${{ secrets.SZAMLA_IMAP_USER }}
          SZAMLA_IMAP_JELSZO: ${{ secrets.SZAMLA_IMAP_JELSZO }}
          SZAMLA_IMAP_MAPPA: ${{ secrets.SZAMLA_IMAP_MAPPA }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          EMAIL_KULDO_SZAMLA: ${{ secrets.EMAIL_KULDO_SZAMLA }}
          EMAIL_JELSZO_SZAMLA: ${{ secrets.EMAIL_JELSZO_SZAMLA }}
          EMAIL_CIMZETT_SZAMLA: ${{ secrets.EMAIL_CIMZETT_SZAMLA }}
          SZAMLA_API_URL: ${{ secrets.SZAMLA_API_URL }}
          SZAMLA_API_KULCS: ${{ secrets.SZAMLA_API_KULCS }}
          SZAMLA_DIJNET_USER: ${{ secrets.SZAMLA_DIJNET_USER }}
          SZAMLA_DIJNET_JELSZO: ${{ secrets.SZAMLA_DIJNET_JELSZO }}
          SZAMLA_VIZMUVEK_USER: ${{ secrets.SZAMLA_VIZMUVEK_USER }}
          SZAMLA_VIZMUVEK_JELSZO: ${{ secrets.SZAMLA_VIZMUVEK_JELSZO }}
          # Google Drive - PDF-feltöltés (opcionális) - ha egyik/mindkettő
          # hiányzik, a script egyszerűen kihagyja a Drive-feltöltést,
          # minden más változatlanul működik.
          SZAMLA_DRIVE_WEBAPP_URL: ${{ secrets.SZAMLA_DRIVE_WEBAPP_URL }}
          SZAMLA_DRIVE_WEBAPP_TOKEN: ${{ secrets.SZAMLA_DRIVE_WEBAPP_TOKEN }}
          # Céges számlák - egy ÚJ, dedikált (a fő SZAMLA_IMAP_*-tól teljesen
          # független) postafiók, kizárólag a cég nevében vásárolt, emailben
          # kért számlákhoz (ld. szamla_figyelo.py "CÉGES SZÁMLÁK" szekció) -
          # mind az öt opcionális, ha valamelyik hiányzik, a modul egyszerűen
          # kimarad, minden más változatlanul működik.
          CEGES_IMAP_HOST: ${{ secrets.CEGES_IMAP_HOST }}
          CEGES_IMAP_PORT: ${{ secrets.CEGES_IMAP_PORT }}
          CEGES_IMAP_USER: ${{ secrets.CEGES_IMAP_USER }}
          CEGES_IMAP_JELSZO: ${{ secrets.CEGES_IMAP_JELSZO }}
          CEGES_IMAP_MAPPA: ${{ secrets.CEGES_IMAP_MAPPA }}
          # NAV Online Számla - bejövő számlák lekérdezése/párosítás a
          # fenti "Céges számlák" postafiókból begyűjtött számlákkal (ld.
          # szamla_figyelo.py "NAV ONLINE SZÁMLA" szekció) - mind a négy
          # opcionális, ha valamelyik hiányzik, a modul egyszerűen kimarad.
          # FONTOS: itt SZÁNDÉKOSAN nincs "cserekulcs" - az itt csak
          # OLVASÓ (queryInvoiceDigest) hívásokhoz nem kell, ld. a fenti
          # szekció-komment indoklását.
          NAV_TECHNIKAI_LOGIN: ${{ secrets.NAV_TECHNIKAI_LOGIN }}
          NAV_TECHNIKAI_JELSZO: ${{ secrets.NAV_TECHNIKAI_JELSZO }}
          NAV_ALAIRO_KULCS: ${{ secrets.NAV_ALAIRO_KULCS }}
          NAV_ADOSZAM: ${{ secrets.NAV_ADOSZAM }}
          # Bérlői körök - a dashboardon besorolt Díjnet/Vízművek-számlák
          # ide mennek (értesítő + havi összesítő) - ha valamelyik nincs
          # beállítva, az adott kör számláiról egyszerűen nem megy ki email
          # (a script naplózza, de nem áll le emiatt).
          SZAMLA_KOR_A_EMAIL: ${{ secrets.SZAMLA_KOR_A_EMAIL }}
          SZAMLA_KOR_B_EMAIL: ${{ secrets.SZAMLA_KOR_B_EMAIL }}
          # Csak akkor "1", ha valaki kézzel (Run workflow gombbal) bepipálta
          # a "dry_run" opciót - az ütemezett (napi 3x-os) futásoknál mindig
          # üres/false, tehát ott mindig éles módban fut.
          SZAMLA_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
          # Csak workflow_dispatch-nál lehet tartalmuk (a dashboard tölti ki) -
          # ütemezett futásnál mindhárom üres, a script ilyenkor kihagyja az
          # ehhez tartozó szakaszt.
          SZAMLA_DATUMTOL: ${{ (github.event_name == 'workflow_dispatch' && inputs.datumtol) || '' }}
          SZAMLA_DATUMIG: ${{ (github.event_name == 'workflow_dispatch' && inputs.datumig) || '' }}
          SZAMLA_CEL_EMAIL: ${{ (github.event_name == 'workflow_dispatch' && inputs.cel_email) || '' }}
          # 3 CÍMZETTI KÖR - manuális, azonnali "Küldés most" gombok a
          # dashboardról (ld. szamlak.html "Címzettek és azonnali küldés"
          # panelje) - ugyanaz a minta, mint a fenti dátum-intervallumos
          # küldésnél: mindegyik üres/false egy ütemezett futásnál, csak
          # workflow_dispatch-nál kaphat tartalmat.
          SZAMLA_BERLO_OSSZESITO_KOR: ${{ (github.event_name == 'workflow_dispatch' && inputs.berlo_osszesito_kor) || '' }}
          SZAMLA_TULAJDONOS_OSSZESITO_MOST: ${{ (github.event_name == 'workflow_dispatch' && inputs.tulajdonos_osszesito) && '1' || '' }}
          SZAMLA_KONYVELO_EMLEKEZTETO_MOST: ${{ (github.event_name == 'workflow_dispatch' && inputs.konyvelo_emlekezteto) && '1' || '' }}
          SZAMLA_PDF_CSATOLAS_MANUALIS: ${{ (github.event_name == 'workflow_dispatch' && inputs.pdf_csatolas_manualis) && '1' || '' }}
          # NAV-panel "Emlékeztető küldése" gomb (ld. szamla_figyelo.py "NAV-ON
          # TALÁLT, HIÁNYZÓ SZÁMLÁK EMLÉKEZTETŐJE" szekció) - csak
          # workflow_dispatch-nál kaphat tartalmat, ütemezett futásnál mindig üres.
          SZAMLA_NAV_EMLEKEZTETO_ADOSZAMOK: ${{ (github.event_name == 'workflow_dispatch' && inputs.nav_emlekezteto_adoszamok) || '' }}
        run: python szamlak/szamla_figyelo.py

      # A korábbi "Állapot commitolása (önjavító)" lépés megszűnt - az
      # állapot mostantól egy MySQL adatbázisban van (ld. szamlak/mysql/
      # api.php), amit a szamla_figyelo.py futás közben, közvetlenül a
      # PHP API-n keresztül ír - nincs többé git commit/push, tehát nincs
      # is 409-ütközés/verseny a dashboard mentéseivel.
