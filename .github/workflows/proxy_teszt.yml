name: 🧪 Ingyenes proxy teszt (Waze)

# Egyszeri kísérlet, semmit nem ment és nem küld e-mailt.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'proxy_teszt.py'
      - '.github/workflows/proxy_teszt.yml'

jobs:
  teszt:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 📦 Telepítés
        run: |
          pip install playwright "requests[socks]"
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: 🧪 Proxyk tesztelése
        env:
          TESZT_MOD: "1"
          FEJLES: "1"
        run: xvfb-run -a python proxy_teszt.py
