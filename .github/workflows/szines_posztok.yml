name: 🌈 Színes posztok

on:
  workflow_dispatch:
    inputs:
      poszt:
        description: 'Egy poszt azonnali kiküldése (programok, ezen_a_napon, erdekesseg, hetvege, kerdes, esti_idojaras) – üresen a menetrend szerint fut'
        required: false
        default: ''
  schedule:
    # Félóránként indul, és 40 percig figyel: a poszt percre pontosan megy ki
    # (a menetrend a szines_posztok.py elején van, helyi idő szerint)
    - cron: '10,40 * * * *'

concurrency:
  # a kézi egyedi poszt nem áll be a 40 perces menetrendi figyelő mögé
  group: szines-posztok-${{ github.event.inputs.poszt || 'menetrend' }}
  cancel-in-progress: false

jobs:
  posztol:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install requests beautifulsoup4

      - name: 🌈 Színes posztok futtatása
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_WEBHOOK_URL_SZINES: ${{ secrets.MAKE_WEBHOOK_URL_SZINES }}
          KENYSZERITETT: ${{ github.event.inputs.poszt }}
        run: python szines_posztok.py

      - name: 💾 Állapot commitolása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A saját állapotot félreteszem, a main legfrissebb állapotára állok,
          # és azzal fésülöm össze (a „kiment” dátumoknál a későbbi marad), így
          # ütközésjel soha nem kerülhet a fájlba. Elutasított push után újra.
          [ -f szines_allapot.json ] || exit 0
          cp szines_allapot.json /tmp/sajat.json
          cat > /tmp/fesul.py <<'PY'
          import json
          sajat = json.load(open("/tmp/sajat.json", encoding="utf-8"))
          try:
              fo = json.load(open("szines_allapot.json", encoding="utf-8"))
          except Exception:
              fo = {}
          k = dict(fo.get("kiment", {}))
          for kulcs, d in sajat.get("kiment", {}).items():
              k[kulcs] = max(k.get(kulcs, ""), d)
          sajat["kiment"] = k
          json.dump(sajat, open("szines_allapot.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python /tmp/fesul.py
            git add szines_allapot.json
            git diff --staged --quiet && break
            git commit -qm "színes posztok állapot [skip ci]"
            git push origin HEAD:main && break
            echo "push elutasítva, újrapróbálom ($i)"; sleep $((i*3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
