<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BKK Kijelző Figyelő</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1d1f; --bg-card: #232629; --amber: #f2a340; --turquoise: #2dd4bf;
    --red: #e24444; --text: #eef0f2; --text-muted: #9aa0a6; --border: #34383c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.5; }

  .hazard-stripe { height: 6px; background: repeating-linear-gradient(-45deg, var(--amber), var(--amber) 14px, #1b1d1f 14px, #1b1d1f 28px); }

  header { max-width: 800px; margin: 0 auto; padding: 40px 24px 20px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); margin-bottom: 8px; }
  h1 { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: clamp(26px, 4vw, 38px); text-transform: uppercase; }
  h1 span { color: var(--turquoise); }
  header p.lead { color: var(--text-muted); font-size: 14px; margin-top: 10px; }
  .frissitve { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); margin-top: 14px; }

  main { max-width: 800px; margin: 0 auto; padding: 0 24px 64px; }

  .szuro-sor { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .szuro-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 7px 14px; border-radius: 100px;
    border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); cursor: pointer;
  }
  .szuro-btn.aktiv { border-color: var(--amber); color: var(--amber); }
  .kereso {
    width: 100%; padding: 10px 14px; margin-bottom: 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-size: 14px;
  }

  .jarmu-item {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 8px; cursor: pointer; border-left: 4px solid var(--border);
  }
  .jarmu-item.rendellenes { border-left-color: var(--red); }
  .jarmu-fejlec { display: flex; justify-content: space-between; align-items: center; }
  .jarmu-jarat { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px; }
  .jarmu-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 8px; border-radius: 100px; background: rgba(154,160,166,0.15); color: var(--text-muted); }
  .jarmu-item.rendellenes .jarmu-badge { background: rgba(226,68,68,0.15); color: var(--red); }
  .jarmu-kijelzo { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
  .jarmu-linkek { display: none; margin-top: 10px; gap: 8px; }
  .jarmu-item.nyitva .jarmu-linkek { display: flex; }
  .jarmu-linkek a { font-size: 12px; color: var(--turquoise); text-decoration: none; }
  .jarmu-linkek a:hover { text-decoration: underline; }

  .ures-allapot { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  footer { text-align: center; padding: 10px 24px 40px; color: var(--text-muted); font-size: 12px; }

  .kapu-overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 2000;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .kapu-doboz { max-width: 340px; width: 100%; text-align: center; }
  .kapu-doboz h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 20px; margin-bottom: 16px; }
  .kapu-doboz input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text); font-size: 15px; margin-bottom: 10px; text-align: center;
  }
  .kapu-jelszo-sor { position: relative; }
  .kapu-jelszo-sor input { padding-right: 44px; }
  .kapu-szem-btn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    margin-top: -5px; background: none; border: none; cursor: pointer;
    font-size: 18px; line-height: 1; padding: 4px; color: var(--text-muted); width: auto;
  }
  .kapu-doboz button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: var(--amber); color: #1b1d1f; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .kapu-hiba { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 18px; }
  .rejtve { display: none !important; }
</style>
</head>
<body>

<div class="kapu-overlay" id="kapuOverlay">
  <div class="kapu-doboz">
    <h2>🔒 Belépés</h2>
    <div class="kapu-jelszo-sor">
      <input type="password" id="kapuJelszo" placeholder="Jelszó" autofocus>
      <button type="button" class="kapu-szem-btn" id="kapuSzemBtn" aria-label="Jelszó mutatása/elrejtése">👁️</button>
    </div>
    <button type="button" id="kapuBtn">Belépés</button>
    <div class="kapu-hiba" id="kapuHiba"></div>
  </div>
</div>

<div id="oldalTartalom" class="rejtve">

<div class="hazard-stripe"></div>

<header>
  <div class="eyebrow">Élő adat · BKK FUTÁR</div>
  <h1>Kijelző <span>·</span> Figyelő</h1>
  <p class="lead">Az összes aktív BKK jármű célállomás-kijelzőjének szövege - kiemelve a rendellenes üzeneteket.</p>
  <div class="frissitve" id="frissitve">Betöltés...</div>
</header>

<main>
  <div class="szuro-sor">
    <button class="szuro-btn aktiv" data-szuro="mind">Mind</button>
    <button class="szuro-btn" data-szuro="rendellenes">🚨 Rendellenes</button>
    <button class="szuro-btn" data-szuro="normal">Normál</button>
  </div>
  <div class="szuro-sor" id="tipusSzurok"></div>
  <input type="text" class="kereso" id="kereso" placeholder="Keresés járatszámra, rendszámra vagy kijelző-szövegre...">

  <div id="tartalom">
    <div class="ures-allapot">⏳ Adatok betöltése...</div>
  </div>
</main>

<footer>Adatforrás: BKK FUTÁR API · Automatikusan frissül</footer>

</div>

<script>
  // ⬇️⬇️⬇️ ITT ÍRD ÁT A SAJÁT JELSZAVADRA ⬇️⬇️⬇️
  const KAPU_JELSZO = "baleset2026";
  const KAPU_EMLEKEZET_KULCS = "bkk_kijelzo_belepve";
  const KAPU_EMLEKEZET_NAPOK = 1;

  function kapuEllenorzes() {
    try {
      const mentett = localStorage.getItem(KAPU_EMLEKEZET_KULCS);
      if (mentett && Number(mentett) > Date.now()) {
        kapuMegnyitas();
      }
    } catch (e) { /* localStorage nem elérhető - marad a jelszókérés */ }
  }

  function kapuMegnyitas() {
    document.getElementById('kapuOverlay').style.display = 'none';
    document.getElementById('oldalTartalom').classList.remove('rejtve');
  }

  document.getElementById('kapuBtn').addEventListener('click', probalkozas);
  document.getElementById('kapuJelszo').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') probalkozas();
  });

  document.getElementById('kapuSzemBtn').addEventListener('click', () => {
    const mezo = document.getElementById('kapuJelszo');
    const gomb = document.getElementById('kapuSzemBtn');
    if (mezo.type === 'password') {
      mezo.type = 'text';
      gomb.textContent = '🙈';
    } else {
      mezo.type = 'password';
      gomb.textContent = '👁️';
    }
  });

  function probalkozas() {
    const beirt = document.getElementById('kapuJelszo').value;
    if (beirt === KAPU_JELSZO) {
      try {
        const lejarat = Date.now() + KAPU_EMLEKEZET_NAPOK * 24 * 60 * 60 * 1000;
        localStorage.setItem(KAPU_EMLEKEZET_KULCS, String(lejarat));
      } catch (e) { /* nem baj, ha nem tudjuk megjegyezni */ }
      kapuMegnyitas();
    } else {
      document.getElementById('kapuHiba').textContent = 'Helytelen jelszó.';
    }
  }

  kapuEllenorzes();

  const ADAT_URL = 'bkk_kijelzo_aktiv.json';
  let osszesJarmu = [];
  let aktivSzuro = 'mind';
  let aktivTipusSzuro = 'mind';
  let keresoSzoveg = '';

  async function betoltes() {
    try {
      const res = await fetch(ADAT_URL + '?t=' + Date.now());
      const data = await res.json();
      osszesJarmu = data.jarmuvek || [];

      const frissitve = new Date(data.frissitve);
      document.getElementById('frissitve').textContent = 'Frissítve: ' + frissitve.toLocaleString('hu-HU');

      renderJarmuvek();
    } catch (err) {
      document.getElementById('tartalom').innerHTML = '<div class="ures-allapot">⚠️ Nem sikerült betölteni az adatokat.</div>';
    }
  }

  function renderJarmuvek() {
    // Jármű-típus szűrőgombok dinamikus felépítése az adatokból talált típusokból
    const tipusok = [...new Set(osszesJarmu.map(j => j.eszkoz_tipus).filter(Boolean))].sort();
    const tipusSzurokDiv = document.getElementById('tipusSzurok');
    if (tipusSzurokDiv.dataset.epitve !== String(tipusok.length)) {
      tipusSzurokDiv.innerHTML = ['<button class="szuro-btn aktiv" data-tipus="mind">Minden eszköztípus</button>']
        .concat(tipusok.map(t => `<button class="szuro-btn" data-tipus="${escapeHtml(t)}">${escapeHtml(t)}</button>`))
        .join('');
      tipusSzurokDiv.dataset.epitve = String(tipusok.length);
      tipusSzurokDiv.querySelectorAll('.szuro-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          tipusSzurokDiv.querySelectorAll('.szuro-btn').forEach(b => b.classList.remove('aktiv'));
          btn.classList.add('aktiv');
          aktivTipusSzuro = btn.dataset.tipus;
          renderJarmuvek();
        });
      });
    }

    let szurt = aktivSzuro === 'mind' ? osszesJarmu : osszesJarmu.filter(j => j.kategoria === aktivSzuro);

    if (aktivTipusSzuro !== 'mind') {
      szurt = szurt.filter(j => j.eszkoz_tipus === aktivTipusSzuro);
    }

    if (keresoSzoveg) {
      const q = keresoSzoveg.toLowerCase();
      szurt = szurt.filter(j =>
        (j.route_id || '').toLowerCase().includes(q) ||
        (j.kijelzo_szoveg || '').toLowerCase().includes(q) ||
        (j.rendszam || '').toLowerCase().includes(q)
      );
    }

    // Rendellenesek elöl
    szurt.sort((a, b) => (a.kategoria === 'rendellenes' ? -1 : 1) - (b.kategoria === 'rendellenes' ? -1 : 1));

    const tartalom = document.getElementById('tartalom');
    if (szurt.length === 0) {
      tartalom.innerHTML = '<div class="ures-allapot">Nincs a szűrésnek megfelelő jármű.</div>';
      return;
    }

    tartalom.innerHTML = szurt.map((j, idx) => {
      const gmaps = (j.lat && j.lon) ? `https://www.google.com/maps?q=${j.lat},${j.lon}&z=17` : null;
      const futarLink = `https://futar.bkk.hu/?vehicleId=${encodeURIComponent(j.vehicle_id)}`;
      const isRendellenes = j.kategoria === 'rendellenes';

      return `
        <div class="jarmu-item ${isRendellenes ? 'rendellenes' : ''}" data-idx="${idx}">
          <div class="jarmu-fejlec">
            <span class="jarmu-jarat">${escapeHtml(j.route_id || '—')} <span style="color:var(--text-muted);font-weight:400">· ${escapeHtml(j.eszkoz_tipus || '')}</span></span>
            <span class="jarmu-badge">${isRendellenes ? '🚨 ' + escapeHtml(j.egyezo_kulcsszo) : 'normál'}</span>
          </div>
          <div class="jarmu-kijelzo">${escapeHtml(j.kijelzo_szoveg || '—')}</div>
          <div class="jarmu-linkek">
            <div style="width:100%;font-size:12px;color:var(--text-muted);margin-bottom:6px">
              🔢 Rendszám: ${escapeHtml(j.rendszam || '—')}<br>
              🚐 Modell: ${escapeHtml(j.modell || '—')}<br>
              🆔 Jármű: ${escapeHtml(j.vehicle_label || j.vehicle_id)}<br>
              📡 Állapot: ${escapeHtml(j.statusz || '—')}${j.akadalymentes === true ? ' · ♿ akadálymentes' : ''}
            </div>
            ${gmaps ? `<a href="${gmaps}" target="_blank">📍 Google Maps</a>` : ''}
            <a href="${futarLink}" target="_blank">🚋 FUTÁR</a>
          </div>
        </div>`;
    }).join('');

    document.querySelectorAll('.jarmu-item').forEach(el => {
      el.addEventListener('click', () => el.classList.toggle('nyitva'));
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  document.querySelectorAll('.szuro-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.szuro-btn').forEach(b => b.classList.remove('aktiv'));
      btn.classList.add('aktiv');
      aktivSzuro = btn.dataset.szuro;
      renderJarmuvek();
    });
  });

  document.getElementById('kereso').addEventListener('input', (e) => {
    keresoSzoveg = e.target.value;
    renderJarmuvek();
  });

  betoltes();
  setInterval(betoltes, 60000);
</script>

</body>
</html>
